services:
  - type: web
    name: user-registration-system
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
